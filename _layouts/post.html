---
layout: default
---
<article class="post">
  <a class="back" href="{{ '/' | relative_url }}">Saish Sakharkar</a>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  {% if page.cover_image %}<img class="cover" src="{{ page.cover_image }}" alt="">{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
