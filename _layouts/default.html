<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <script>
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    {{ content }}

    <footer class="site-footer">
      <nav aria-label="Elsewhere">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="https://github.com/{{ site.github }}">GitHub</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button">Light mode</button>
    </footer>
  </main>

  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme-toggle");
      function sync() {
        var dark = root.getAttribute("data-theme") !== "light";
        btn.textContent = dark ? "Light mode" : "Dark mode";
        btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      }
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
