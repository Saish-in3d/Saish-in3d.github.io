<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">Saish<span>in3d</span></a>
    <nav aria-label="Main">
      <a href="{{ '/projects/' | relative_url }}" {% if page.nav == 'projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/portfolio/' | relative_url }}" {% if page.nav == 'portfolio' %}aria-current="page"{% endif %}>Portfolio</a>
      <a href="{{ '/articles/' | relative_url }}" {% if page.nav == 'articles' %}aria-current="page"{% endif %}>Articles</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Saish Sakharkar. Code on <a href="https://github.com/{{ site.github }}">GitHub</a>.</p>
  </footer>
  {% if page.hero_shader %}<script src="{{ '/assets/js/hero.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
